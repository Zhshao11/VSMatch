<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1670" viewBox="0 0 1800 1670">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="70" y="42" text-anchor="start" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="44" font-weight="600" fill="#182b46">展开 F2 / F3：两类融合发生在哪里</text>
<text x="70" y="108" text-anchor="start" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#51647a">每个 F2/F3 实例都有自己的 V1/V2 特征分支；同名不代表跨实例共享权重。</text>
<rect x="550" y="170" width="700" height="95" rx="18" fill="#eef5fc" stroke="#2366ad" stroke-width="2"/>
<text x="900.0" y="186" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="600" fill="#2366ad">同一对 OPT / SAR 输入</text>
<text x="900.0" y="228" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#182b46">归一化至 [−1, 1]</text>
<polyline points="900,265 900,300 455,300 455,344" fill="none" stroke="#2366ad" stroke-width="3"/>
<polygon points="455,344 448.99687071796075,332.46906600386933 461.00312928203925,332.46906600386933" fill="#2366ad"/>
<polyline points="900,300 1345,300 1345,344" fill="none" stroke="#128578" stroke-width="3"/>
<polygon points="1345,344 1338.9968707179607,332.46906600386933 1351.0031292820393,332.46906600386933" fill="#128578"/>
<rect x="70" y="350" width="770" height="170" rx="18" fill="#eef5fc" stroke="#2366ad" stroke-width="2"/>
<text x="455.0" y="366" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="600" fill="#2366ad">V1：GDROS 风格特征</text>
<text x="455.0" y="408" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#182b46">模态残差输入适配 → CNN（stride 8）</text>
<text x="455.0" y="445" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#182b46">位置编码 → 跨图 Transformer</text>
<text x="455.0" y="482" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#182b46">输出一对 256 × 64 × 64 特征</text>
<rect x="960" y="350" width="770" height="170" rx="18" fill="#ecf8f4" stroke="#128578" stroke-width="2"/>
<text x="1345.0" y="366" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="600" fill="#128578">V2：DINO 辅助的 GDROS 风格特征</text>
<text x="1345.0" y="408" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#182b46">GDROS 风格特征 + 冻结 E046 / DINO 前端</text>
<text x="1345.0" y="445" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#182b46">DINO 特征投影 / FiLM 残差注入</text>
<text x="1345.0" y="482" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#182b46">输出一对 256 × 64 × 64 特征</text>
<rect x="65" y="600" width="800" height="715" rx="18" fill="#ffffff" stroke="#9ebfe1" stroke-width="2"/>
<rect x="935" y="600" width="800" height="715" rx="18" fill="#ffffff" stroke="#8ec9be" stroke-width="2"/>
<text x="100" y="625" text-anchor="start" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="31" font-weight="600" fill="#2366ad">F2：先融合特征，再计算相关性</text>
<text x="970" y="625" text-anchor="start" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="31" font-weight="600" fill="#128578">F3：先分别计算相关性，再融合</text>
<polyline points="455,520 455,560 85,560 85,680 465,680 465,695" fill="none" stroke="#2366ad" stroke-width="3"/>
<polygon points="465,695 458.99687071796075,683.4690660038693 471.00312928203925,683.4690660038693" fill="#2366ad"/>
<polyline points="1345,520 1345,560 1710,560 1710,680 1345,680 1345,687" fill="none" stroke="#128578" stroke-width="3"/>
<polygon points="1345,687 1338.9968707179607,675.4690660038693 1351.0031292820393,675.4690660038693" fill="#128578"/>
<polyline points="455,560 1345,560" fill="none" stroke="#51647a" stroke-width="3"/>
<rect x="110" y="695" width="710" height="140" rx="18" fill="#eef5fc" stroke="#2366ad" stroke-width="2"/>
<text x="465.0" y="711" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="600" fill="#2366ad">特征门控 + 投影</text>
<text x="465.0" y="753" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#182b46">分别融合 source / target 的 V1 与 V2 特征</text>
<text x="465.0" y="790" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#182b46">门控为逐位置标量，输出仍为 256 通道</text>
<polyline points="465,835 465,884" fill="none" stroke="#2366ad" stroke-width="3"/>
<polygon points="465,884 458.99687071796075,872.4690660038693 471.00312928203925,872.4690660038693" fill="#2366ad"/>
<rect x="110" y="890" width="710" height="105" rx="18" fill="#eef5fc" stroke="#2366ad" stroke-width="2"/>
<text x="465.0" y="906" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="600" fill="#2366ad">1 套 4D all-pairs 相关金字塔</text>
<text x="465.0" y="948" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#182b46">4 层 target 维度平均池化，查询半径 r=4</text>
<polyline points="465,995 465,1110" fill="none" stroke="#2366ad" stroke-width="3"/>
<polygon points="465,1110 458.99687071796075,1098.4690660038693 471.00312928203925,1098.4690660038693" fill="#2366ad"/>
<rect x="110" y="1115" width="710" height="135" rx="18" fill="#eef5fc" stroke="#2366ad" stroke-width="2"/>
<text x="465.0" y="1131" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="600" fill="#2366ad">单个 GRU 更新器，共享权重迭代 T 轮</text>
<text x="465.0" y="1173" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#182b46">相关性查询 + 当前 flow + source context</text>
<text x="465.0" y="1210" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#182b46">更新坐标，并学习上采样到 512 × 512</text>
<rect x="980" y="695" width="325" height="140" rx="18" fill="#ecf8f4" stroke="#128578" stroke-width="2"/>
<text x="1142.5" y="711" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="600" fill="#128578">V1 相关金字塔</text>
<text x="1142.5" y="753" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#182b46">4 层 / r=4</text>
<text x="1142.5" y="788" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#182b46">每轮查询 324 通道</text>
<rect x="1365" y="695" width="325" height="140" rx="18" fill="#ecf8f4" stroke="#128578" stroke-width="2"/>
<text x="1527.5" y="711" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="600" fill="#128578">V2 相关金字塔</text>
<text x="1527.5" y="753" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#182b46">4 层 / r=4</text>
<text x="1527.5" y="788" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" fill="#182b46">每轮查询 324 通道</text>
<polyline points="1345,687 1345,690 1142,690 1142,695" fill="none" stroke="#128578" stroke-width="3"/>
<polygon points="1142,695 1135.9968707179607,683.4690660038693 1148.0031292820393,683.4690660038693" fill="#128578"/>
<polyline points="1345,690 1527,690 1527,695" fill="none" stroke="#128578" stroke-width="3"/>
<polygon points="1527,695 1520.9968707179607,683.4690660038693 1533.0031292820393,683.4690660038693" fill="#128578"/>
<polyline points="1142,835 1142,870 1335,870 1335,884" fill="none" stroke="#128578" stroke-width="3"/>
<polygon points="1335,884 1328.9968707179607,872.4690660038693 1341.0031292820393,872.4690660038693" fill="#128578"/>
<polyline points="1527,835 1527,870 1335,870" fill="none" stroke="#128578" stroke-width="3"/>
<rect x="980" y="890" width="710" height="175" rx="18" fill="#ecf8f4" stroke="#128578" stroke-width="2"/>
<text x="1335.0" y="906" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="600" fill="#128578">每轮融合两套查询响应</text>
<text x="1335.0" y="948" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#182b46">corr_t = (1 − α) · corrV1_t + α · corrV2_t</text>
<text x="1335.0" y="984" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#182b46">α 为学习到的全局标量，不是逐对置信度</text>
<text x="1335.0" y="1020" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" fill="#182b46">两套均在同一个当前坐标处查询</text>
<polyline points="1335,1065 1335,1110" fill="none" stroke="#128578" stroke-width="3"/>
<polygon points="1335,1110 1328.9968707179607,1098.4690660038693 1341.0031292820393,1098.4690660038693" fill="#128578"/>
<rect x="980" y="1115" width="710" height="135" rx="18" fill="#ecf8f4" stroke="#128578" stroke-width="2"/>
<text x="1335.0" y="1131" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="600" fill="#128578">单个 GRU 更新器，共享权重迭代 T 轮</text>
<text x="1335.0" y="1173" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#182b46">同一个 recurrent state 接收融合后的响应</text>
<text x="1335.0" y="1210" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#182b46">两个金字塔不对应两个独立 GRU</text>
<rect x="110" y="1380" width="1580" height="175" rx="18" fill="#f4effa" stroke="#7552b2" stroke-width="2"/>
<text x="900.0" y="1396" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="600" fill="#7552b2">容易混淆的三个概念</text>
<text x="900.0" y="1438" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#182b46">“4D”表示 source (x,y) × target (x,y)，不是 4 个特征尺度。</text>
<text x="900.0" y="1477" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#182b46">“4 层金字塔”是每套相关体内部的 target 尺度；F3 有 2 套这样的金字塔。</text>
<text x="900.0" y="1516" text-anchor="middle" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#182b46">“T 轮 GRU”是同一更新器复用 T 次；完整 M4 又包含多个独立 matcher 实例。</text>
<text x="70" y="1602" text-anchor="start" dominant-baseline="text-before-edge" font-family="STHeiti,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" fill="#51647a">LSR 位于外层门控与最终输出；F2/F3 的推理循环内部未进行 LSR 坐标反馈。</text>
</svg>